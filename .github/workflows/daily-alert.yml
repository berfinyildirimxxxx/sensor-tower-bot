name: Daily Alert
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run the bot in Slack test mode"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  run-daily-alert:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      SENSOR_TOWER_API_KEY: ${{ secrets.SENSOR_TOWER_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SENSORTOWER_SESSION: ${{ secrets.SENSORTOWER_SESSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot in test mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}
        run: python main.py --test
      - name: Run bot
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_mode }}
        run: python main.py
      - name: Commit and push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_games.json docs/games_data.json
          git diff --cached --quiet || (git commit -m "chore: update web data [skip ci]" && git push)
      - name: Notify Slack on failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          import requests
          webhook_url = os.environ["SLACK_WEBHOOK_URL"]
          payload = {
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "❌ Sensor Tower bot failed today, check GitHub Actions logs."
                      }
                  }
              ]
          }
          requests.post(webhook_url, json=payload, timeout=15)
          PY
