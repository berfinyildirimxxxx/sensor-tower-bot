name: Test Taxonomy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENSOR_TOWER_API_KEY: ${{ secrets.SENSOR_TOWER_API_KEY }}
      SENSORTOWER_SESSION: ${{ secrets.SENSORTOWER_SESSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python test_intel_session.py
