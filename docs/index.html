<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agave Game Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --surface-2: #f5f5f4;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --text: #1c1917;
    --text-muted: #57534e;
    --text-soft: #a8a29e;

    --orange: #ea580c;
    --orange-soft: #fff7ed;
    --orange-border: #fed7aa;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --green-border: #bbf7d0;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --blue-border: #bfdbfe;
    --purple: #7c3aed;
    --purple-soft: #faf5ff;
    --purple-border: #ddd6fe;
    --pink: #db2777;
    --pink-soft: #fdf2f8;
    --pink-border: #fbcfe8;
    --amber: #d97706;
    --red: #dc2626;
    --indigo: #4f46e5;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
  }

  [data-theme="dark"] {
    --bg: #0c0a09;
    --surface: #1c1917;
    --surface-2: #292524;
    --border: #292524;
    --border-strong: #44403c;
    --text: #fafaf9;
    --text-muted: #a8a29e;
    --text-soft: #78716c;

    --orange-soft: rgba(234, 88, 12, 0.12);
    --orange-border: rgba(234, 88, 12, 0.35);
    --green-soft: rgba(22, 163, 74, 0.12);
    --green-border: rgba(22, 163, 74, 0.35);
    --blue-soft: rgba(37, 99, 235, 0.12);
    --blue-border: rgba(37, 99, 235, 0.35);
    --purple-soft: rgba(124, 58, 237, 0.12);
    --purple-border: rgba(124, 58, 237, 0.35);
    --pink-soft: rgba(219, 39, 119, 0.12);
    --pink-border: rgba(219, 39, 119, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ============ TOPBAR ============ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  [data-theme="dark"] .topbar { background: rgba(28, 25, 23, 0.85); }
  .topbar::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--orange) 0%, var(--green) 50%, var(--purple) 100%);
    opacity: 0.7;
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, var(--text), var(--orange));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .logo-icon {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--orange-soft);
    border-radius: 8px;
    font-size: 16px;
    box-shadow: 0 0 12px rgba(234, 88, 12, 0.25);
  }
  .topbar-meta {
    flex: 1;
    color: var(--text-soft);
    font-size: 12px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: all 0.18s ease;
  }
  .btn-icon:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .btn-sheet {
    width: auto; padding: 0 12px; gap: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--green);
  }
  .btn-sheet:hover { background: var(--green-soft); border-color: var(--green-border); }

  /* ============ MAIN LAYOUT ============ */
  .main {
    max-width: 1400px; margin: 0 auto;
    padding: 24px;
  }

  /* ============ STAT CARDS (2 boxes) ============ */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px 18px 24px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .stat::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .stat.scanned::before { background: var(--orange); }
  .stat.radar::before { background: var(--blue); }
  .stat.scanned::after {
    content: '';
    position: absolute; right: -40px; top: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--orange-soft) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .stat-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 32px; font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat-sub {
    margin-top: 8px;
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; color: var(--text-muted);
  }
  .stat-sub-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ios { background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  .dot.android { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ============ MECHANIC BAND ============ */
  .mech-band {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .mech-band-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .mech-band-label::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--orange);
  }
  .mech-pills {
    display: flex; flex-wrap: wrap; gap: 6px;
  }

  /* ============ FILTER BAR ============ */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .search-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .search {
    flex: 1; position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 13px;
    transition: all 0.15s ease;
  }
  .search input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-soft);
  }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--text-soft); font-size: 14px;
  }
  .view-toggle {
    display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .view-toggle button {
    padding: 7px 12px;
    background: var(--surface); color: var(--text-muted);
    border: none; cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all 0.15s;
  }
  .view-toggle button.active {
    background: var(--text); color: var(--surface);
  }

  .filter-row {
    display: flex; flex-direction: column; gap: 10px;
  }
  .filter-group {
    display: flex; align-items: center; gap: 8px;
  }
  .filter-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    min-width: 90px; flex-shrink: 0;
  }
  .filter-label::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
  }
  .fl-platform::before { background: var(--purple); }
  .fl-score::before { background: var(--green); }
  .fl-release::before { background: var(--amber); }
  .fl-added::before { background: var(--pink); }
  .fl-sort::before { background: var(--indigo); }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }

  .pill {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .pill:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    color: var(--text);
  }
  .pill.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
    font-weight: 600;
  }
  .pill .count {
    margin-left: 5px;
    opacity: 0.6;
    font-size: 11px;
  }
  /* Color-coded active pills per group */
  .pills[data-group="platform"] .pill.active { background: var(--purple); border-color: var(--purple); color: white; box-shadow: 0 0 0 3px var(--purple-soft); }
  .pills[data-group="category"] .pill.active { background: var(--orange); border-color: var(--orange); color: white; box-shadow: 0 0 0 3px var(--orange-soft); }
  .pills[data-group="release"] .pill.active { background: var(--amber); border-color: var(--amber); color: white; }
  .pills[data-group="added"] .pill.active { background: var(--pink); border-color: var(--pink); color: white; }
  .pills[data-group="sort"] .pill.active { background: var(--indigo); border-color: var(--indigo); color: white; }

  .date-picker {
    display: inline-flex; align-items: center;
    padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface);
    font-size: 12px; font-family: inherit;
    color: var(--text-muted);
    cursor: pointer;
  }
  .date-picker input {
    border: none; background: transparent;
    color: var(--text); font-family: inherit;
    width: 110px;
  }
  .date-picker input:focus { outline: none; }

  /* ============ RESULT BAR ============ */
  .result-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 8px 4px 14px;
    font-size: 12px; color: var(--text-muted);
  }
  .result-count strong { color: var(--text); font-weight: 600; }

  /* ============ GAME GRID ============ */
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .games.list-view {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--border-strong);
  }
  .card-head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .card-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  .card-title-block { flex: 1; min-width: 0; }
  .card-name {
    font-weight: 600; font-size: 14px;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-publisher {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-added {
    position: absolute; top: 10px; right: 12px;
    font-size: 10px; font-weight: 600;
    color: var(--text-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .card-added.new {
    color: var(--orange);
    background: var(--orange-soft);
    padding: 3px 7px;
    border-radius: 5px;
    border: 1px solid var(--orange-border);
  }
  .badges {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 8px;
  }
  .badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 7px; border-radius: 5px;
    background: var(--surface-2);
    color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .badge.ios { background: var(--purple-soft); color: var(--purple); }
  .badge.android { background: var(--green-soft); color: var(--green); }
  .badge.installs { background: var(--blue-soft); color: var(--blue); }
  .badge.score-high { background: var(--green-soft); color: var(--green); }
  .badge.score-mid { background: rgba(217, 119, 6, 0.12); color: var(--amber); }
  .badge.score-low { background: rgba(220, 38, 38, 0.10); color: var(--red); }
  .badge.score-zero { background: var(--surface-2); color: var(--text-soft); }
  .badge.mechanic {
    background: var(--orange-soft); color: var(--orange);
    border: 1px solid var(--orange-border);
  }
  .card-released {
    margin-top: 8px;
    font-size: 11px; color: var(--text-soft);
    display: flex; align-items: center; gap: 5px;
  }
  .card-released::before { content: '📅'; font-size: 11px; }

  /* ============ LIST VIEW ============ */
  .games.list-view .card {
    display: grid;
    grid-template-columns: 48px 1fr auto auto auto auto;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
  }
  .games.list-view .card-head { margin-bottom: 0; display: contents; }
  .games.list-view .card-title-block { min-width: 0; }
  .games.list-view .badges, .games.list-view .card-released, .games.list-view .card-added {
    position: static;
    margin: 0;
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    max-width: 720px; width: 100%;
    max-height: 90vh; overflow: auto;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { display: flex; gap: 16px; margin-bottom: 16px; }
  .modal-icon { width: 80px; height: 80px; border-radius: 16px; flex-shrink: 0; overflow: hidden; }
  .modal-icon img { width: 100%; height: 100%; object-fit: cover; }
  .modal-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .modal-publisher { color: var(--text-muted); font-size: 14px; margin: 0 0 10px; }
  .modal-close {
    margin-left: auto;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface-2); border: none; cursor: pointer;
    font-size: 16px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .modal-close:hover { background: var(--red); color: white; transform: rotate(90deg); }
  .modal-desc { color: var(--text-muted); margin: 14px 0; line-height: 1.6; font-size: 13px; }
  .modal-platforms {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px; margin: 14px 0;
  }
  .platform-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
  }
  .platform-box-name { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .platform-box-row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-muted); }
  .platform-box-row strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .screenshots { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
  .screenshots img { height: 200px; border-radius: 8px; flex-shrink: 0; }
  .modal-actions { margin-top: 18px; display: flex; gap: 8px; }
  .btn-primary {
    padding: 9px 16px; background: linear-gradient(135deg, var(--orange), #c2410c);
    color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 13px;
    cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(234, 88, 12, 0.4); }

  /* ============ EMPTY ============ */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-soft); font-size: 13px;
  }

  @media (max-width: 760px) {
    .stats { grid-template-columns: 1fr; }
    .filter-row { gap: 12px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" style="width:22px;height:22px;">
          <polygon points="0,82 20,56 31,70" fill="#1a4a35"/>
          <polygon points="20,56 37,18 46,56" fill="#1a4a35"/>
          <polygon points="37,18 50,0 63,18 54,60 46,60" fill="#1a4a35"/>
          <polygon points="54,56 63,18 80,56" fill="#1a4a35"/>
          <polygon points="69,70 80,56 100,82" fill="#1a4a35"/>
          <polygon points="31,70 46,56 46,70" fill="#0f2e20"/>
          <polygon points="54,70 54,56 69,70" fill="#0f2e20"/>
        </svg>
      </div>
      Agave Game Radar
    </div>
    <div class="topbar-meta" id="lastUpdated">Loading…</div>
    <div class="topbar-actions">
      <a href="#" id="sheetBtn" class="btn-icon btn-sheet" target="_blank" rel="noopener" title="Open Google Sheet">
        📁 Sheet
      </a>
      <button class="btn-icon" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<main class="main">

  <!-- 2 STAT CARDS -->
  <section class="stats">
    <div class="stat scanned">
      <div class="stat-label" id="scannedLabel">Scanned today</div>
      <div class="stat-value mono" id="scannedValue">0</div>
      <div class="stat-sub">
        <span class="stat-sub-item"><span class="dot ios"></span>iOS <strong class="mono" id="iosCount">0</strong></span>
        <span class="stat-sub-item"><span class="dot android"></span>Android <strong class="mono" id="androidCount">0</strong></span>
      </div>
    </div>
    <div class="stat radar">
      <div class="stat-label">Total on radar</div>
      <div class="stat-value mono" id="radarValue">0</div>
      <div class="stat-sub"><span>for 30 days</span></div>
    </div>
  </section>

  <!-- CATEGORY BAND -->
  <section class="mech-band">
    <div class="mech-band-label">Category</div>
    <div class="pills" data-group="category" id="categoryPills"></div>
  </section>

  <!-- FILTER BAR -->
  <section class="filter-bar">
    <div class="search-row">
      <div class="search">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name or publisher…" />
      </div>
      <div class="view-toggle">
        <button id="viewGrid" class="active">Grid</button>
        <button id="viewList">List</button>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label fl-platform">Platform</span>
        <div class="pills" data-group="platform" id="platformPills">
          <button class="pill active" data-platform="all">All</button>
          <button class="pill" data-platform="ios">iOS</button>
          <button class="pill" data-platform="android">Android</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label fl-release">Released</span>
        <div class="pills" data-group="release" id="releasePills">
          <button class="pill active" data-release="all">All</button>
          <button class="pill" data-release="7">Last 7d</button>
          <button class="pill" data-release="30">Last 30d</button>
          <button class="pill" data-release="60">Last 60d</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label fl-added">Added</span>
        <div class="pills" data-group="added" id="addedPills">
          <button class="pill active" data-added="all">All</button>
          <button class="pill" data-added="0">Today</button>
          <button class="pill" data-added="1">Yesterday</button>
          <button class="pill" data-added="3">3d</button>
          <button class="pill" data-added="7">7d</button>
          <button class="pill" data-added="14">14d</button>
        </div>
        <label class="date-picker">📅 <input type="date" id="datePick" /></label>
      </div>

      <div class="filter-group">
        <span class="filter-label fl-sort">Sort</span>
        <div class="pills" data-group="sort" id="sortPills">
          <button class="pill active" data-sort="installs">Most installs</button>
          <button class="pill" data-sort="added">Newest added</button>
          <button class="pill" data-sort="released">Newest released</button>
        </div>
      </div>
    </div>
  </section>

  <div class="result-bar">
    <div class="result-count">Showing <strong id="shownCount">0</strong> of <strong id="totalCount">0</strong> games</div>
  </div>

  <section class="games" id="gamesGrid"></section>
  <div class="empty" id="emptyState" style="display:none;">No games match your filters.</div>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
let allGames = [];
let dataMeta = {};
const filters = {
  platform: 'all',
  category: 'all',
  release: 'all',
  added: 'all',
  addedDate: null,
  sort: 'installs',
  search: '',
};
let view = 'grid';

// ---------- helpers ----------
function getScore(g) {
  const v = g.score;
  if (typeof v === 'number') return v;
  const n = parseInt(String(v), 10);
  return isNaN(n) ? 0 : n;
}
function getInstalls(g) {
  const v = g.installs_total ?? g.installs;
  if (typeof v === 'number') return v;
  const n = parseInt(String(v).replace(/[,.\s]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}
function fmtInstalls(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
function fmtDate(s) {
  if (!s) return '';
  // accept ISO date or full string
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function daysAgo(s) {
  if (!s) return Infinity;
  const d = new Date(s);
  if (isNaN(d.getTime())) return Infinity;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}
function addedLabel(g) {
  const d = daysAgo(g.first_seen);
  if (d <= 0) return 'Today';
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + 'd ago';
  if (d < 14) return '1 week ago';
  if (d < 30) return Math.floor(d / 7) + ' weeks ago';
  return d + 'd ago';
}
function scoreBadgeClass(s) {
  if (s === 0) return 'score-zero';
  if (s >= 70) return 'score-high';
  if (s >= 40) return 'score-mid';
  return 'score-low';
}
function getPlatforms(g) {
  if (Array.isArray(g.platforms) && g.platforms.length) return g.platforms;
  return [{
    platform: g.platform || '',
    installs_total: getInstalls(g),
    launch_date: g.launch_date,
    store_url: g.store_url,
  }];
}
function hasPlatform(g, p) {
  const plats = getPlatforms(g).map(x => String(x.platform).toLowerCase());
  return plats.some(x => x.includes(p));
}

// ---------- data load ----------
async function loadData() {
  try {
    const r = await fetch('games_data.json?_=' + Date.now());
    const text = await r.text();
    if (!r.ok || text.trim().startsWith('<')) {
      document.getElementById('lastUpdated').textContent = 'No data yet — run the bot first (Actions → Daily Alert → Run workflow)';
      document.getElementById('sheetBtn').href = 'https://docs.google.com/spreadsheets/d/1u0E3Cj5Ryzmmqd7NJbgs6gcexTKBQ36c4dwLy4vF5Ws/edit';
      document.getElementById('sheetBtn').style.display = '';
      return;
    }
    const data = JSON.parse(text);
    allGames = data.games || [];
    dataMeta = data;
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + (data.last_updated || '—');

    // Scanned label with today's date
    const dateStr = data.run_date || new Date().toISOString().slice(0, 10);
    const lbl = fmtDate(dateStr);
    document.getElementById('scannedLabel').textContent = 'Scanned ' + lbl;
    document.getElementById('scannedValue').textContent = (data.total_fetched_today || 0).toLocaleString();
    document.getElementById('iosCount').textContent = (data.ios_fetched_today || 0).toLocaleString();
    document.getElementById('androidCount').textContent = (data.android_fetched_today || 0).toLocaleString();
    document.getElementById('radarValue').textContent = (data.total_games_on_site || allGames.length).toLocaleString();

    // Sheet button
    const sheetBtn = document.getElementById('sheetBtn');
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1u0E3Cj5Ryzmmqd7NJbgs6gcexTKBQ36c4dwLy4vF5Ws/edit';
    sheetBtn.href = data.sheet_url || SHEET_URL;
    sheetBtn.style.display = '';

    buildCategoryPills();
    bindFilters();
    render();
  } catch (e) {
    console.error('Load failed', e);
    document.getElementById('lastUpdated').textContent = 'Failed to load data';
  }
}

// ---------- category pills (from intel_category in data) ----------
const CATEGORY_ORDER = ['Puzzle','Casual','Word','Board','Family','Trivia','Arcade','Card','Educational'];

function buildCategoryPills() {
  const counts = new Map();
  allGames.forEach(g => {
    const cat = (g.intel_category || '').trim();
    if (cat) counts.set(cat, (counts.get(cat) || 0) + 1);
  });

  // Sort by our predefined order first, then alphabetically for any extras
  const sorted = [...counts.entries()].sort((a, b) => {
    const ai = CATEGORY_ORDER.indexOf(a[0]);
    const bi = CATEGORY_ORDER.indexOf(b[0]);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a[0].localeCompare(b[0]);
  });

  const container = document.getElementById('categoryPills');
  container.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'pill active';
  allBtn.dataset.category = 'all';
  allBtn.innerHTML = `All <span class="count">${allGames.length}</span>`;
  container.appendChild(allBtn);

  sorted.forEach(([name, count]) => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.dataset.category = name;
    b.innerHTML = `${name} <span class="count">${count}</span>`;
    container.appendChild(b);
  });
}

// ---------- bind filter pills ----------
function bindFilters() {
  document.querySelectorAll('.pills').forEach(group => {
    group.addEventListener('click', e => {
      const pill = e.target.closest('.pill');
      if (!pill) return;
      group.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const g = group.dataset.group;
      if (g === 'platform') filters.platform = pill.dataset.platform;
      if (g === 'category') filters.category = pill.dataset.category;
      if (g === 'release') filters.release = pill.dataset.release;
      if (g === 'added') { filters.added = pill.dataset.added; filters.addedDate = null; document.getElementById('datePick').value = ''; }
      if (g === 'sort') filters.sort = pill.dataset.sort;
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    filters.search = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('datePick').addEventListener('change', e => {
    if (e.target.value) {
      filters.addedDate = e.target.value;
      filters.added = 'pick';
      document.querySelectorAll('#addedPills .pill').forEach(p => p.classList.remove('active'));
    }
    render();
  });

  document.getElementById('viewGrid').addEventListener('click', () => setView('grid'));
  document.getElementById('viewList').addEventListener('click', () => setView('list'));

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
    if (e.key === 'Escape') closeModal();
  });
}

function setView(v) {
  view = v;
  document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
  document.getElementById('viewList').classList.toggle('active', v === 'list');
  document.getElementById('gamesGrid').classList.toggle('list-view', v === 'list');
}

// ---------- filter + render ----------
function applyFilters() {
  return allGames.filter(g => {
    if (filters.platform !== 'all' && !hasPlatform(g, filters.platform)) return false;
    if (filters.category !== 'all' && (g.intel_category || '') !== filters.category) return false;

    if (filters.release !== 'all') {
      const r = daysAgo(g.launch_date);
      if (r > parseInt(filters.release, 10)) return false;
    }

    if (filters.added === 'pick' && filters.addedDate) {
      if (String(g.first_seen) !== filters.addedDate) return false;
    } else if (filters.added !== 'all') {
      const d = daysAgo(g.first_seen);
      const n = parseInt(filters.added, 10);
      if (n === 0 && d !== 0) return false;
      if (n === 1 && d !== 1) return false;
      if (n >= 3 && d > n) return false;
    }

    if (filters.search) {
      const hay = ((g.name || '') + ' ' + (g.publisher || '')).toLowerCase();
      if (!hay.includes(filters.search)) return false;
    }
    return true;
  });
}

function sortGames(games) {
  const s = filters.sort;
  return [...games].sort((a, b) => {
    if (s === 'installs') return getInstalls(b) - getInstalls(a);
    if (s === 'added') return (b.first_seen || '').localeCompare(a.first_seen || '');
    if (s === 'released') return (b.launch_date || '').localeCompare(a.launch_date || '');
    return 0;
  });
}

function render() {
  let games = applyFilters();
  games = sortGames(games);

  document.getElementById('shownCount').textContent = games.length.toLocaleString();
  document.getElementById('totalCount').textContent = allGames.length.toLocaleString();

  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');
  if (!games.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  grid.innerHTML = games.map((g, i) => renderCard(g, i)).join('');
  grid.querySelectorAll('.card').forEach((el, i) => {
    el.addEventListener('click', () => openModal(games[i]));
  });
}

function renderCard(g, i) {
  const installs = getInstalls(g);
  const plats = getPlatforms(g);
  const addLbl = addedLabel(g);
  const isNew = daysAgo(g.first_seen) <= 1;

  const iconHtml = g.icon_url
    ? `<img src="${escapeAttr(g.icon_url)}" alt="" onerror="this.parentNode.innerHTML='${(g.name||'?').charAt(0).toUpperCase()}'; this.parentNode.style.background='${pickIconColor(g.intel_category)}';" />`
    : `<span>${(g.name || '?').charAt(0).toUpperCase()}</span>`;
  const iconStyle = g.icon_url ? '' : `background:${pickIconColor(g.intel_category)};`;

  const platformBadges = plats.map(p => {
    const name = String(p.platform || '').toLowerCase();
    if (name.includes('ios')) return '<span class="badge ios">📱 iOS</span>';
    if (name.includes('android')) return '<span class="badge android">🤖 Android</span>';
    return '';
  }).join('');

  return `
    <div class="card">
      <div class="card-added ${isNew ? 'new' : ''}">${addLbl}</div>
      <div class="card-head">
        <div class="card-icon" style="${iconStyle}">${iconHtml}</div>
        <div class="card-title-block">
          <div class="card-name">${escapeHtml(g.name || 'Unknown')}</div>
          <div class="card-publisher">${escapeHtml(g.publisher || '—')}</div>
        </div>
      </div>
      <div class="badges">
        ${platformBadges}
        <span class="badge installs">${fmtInstalls(installs)} installs</span>
        ${g.intel_category ? `<span class="badge" style="background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-border);">${escapeHtml(g.intel_category)}</span>` : ''}
        ${g.intel_sub_genre ? `<span class="badge" style="background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-border);">${escapeHtml(g.intel_sub_genre)}</span>` : ''}
      </div>
      ${g.launch_date ? `<div class="card-released">Released ${fmtDate(g.launch_date)}</div>` : ''}
    </div>
  `;
}

function pickIconColor(cat) {
  const map = {
    'Puzzle': '#7c3aed', 'Casual': '#ea580c', 'Word': '#16a34a',
    'Board': '#0891b2', 'Family': '#db2777', 'Trivia': '#d97706',
    'Arcade': '#dc2626', 'Card': '#0d9488', 'Educational': '#2563eb',
  };
  return map[cat] || '#78716c';
}

// ---------- modal ----------
function openModal(g) {
  const plats = getPlatforms(g);
  const platHtml = plats.map(p => {
    const name = String(p.platform || '');
    const icon = name.toLowerCase().includes('ios') ? '📱' : '🤖';
    return `
      <div class="platform-box">
        <div class="platform-box-name">${icon} ${escapeHtml(name.toUpperCase())}</div>
        <div class="platform-box-row"><span>Installs</span><strong>${fmtInstalls(p.installs_total)}</strong></div>
        <div class="platform-box-row"><span>Released</span><strong>${fmtDate(p.launch_date) || '—'}</strong></div>
        ${p.store_url ? `<div class="platform-box-row"><a href="${escapeAttr(p.store_url)}" target="_blank" rel="noopener">Open in store →</a></div>` : ''}
      </div>
    `;
  }).join('');

  const iconHtml = g.icon_url
    ? `<img src="${escapeAttr(g.icon_url)}" alt="" />`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${pickIconColor(g.intel_category)};color:white;font-size:32px;font-weight:700;">${(g.name||'?').charAt(0).toUpperCase()}</div>`;

  const screenshots = (g.screenshots || []).slice(0, 6).map(s =>
    `<img src="${escapeAttr(s)}" alt="" onerror="this.style.display='none'" />`
  ).join('');

  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div class="modal-icon">${iconHtml}</div>
      <div style="flex:1;min-width:0;">
        <h2 class="modal-title">${escapeHtml(g.name || 'Unknown')}</h2>
        <p class="modal-publisher">${escapeHtml(g.publisher || '—')}</p>
        <div class="badges">
          ${g.intel_category ? `<span class="badge" style="background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-border);">${escapeHtml(g.intel_category)}</span>` : ''}
          ${g.intel_sub_genre ? `<span class="badge" style="background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-border);">${escapeHtml(g.intel_sub_genre)}</span>` : ''}
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${g.description ? `<p class="modal-desc">${escapeHtml(g.description)}</p>` : ''}
    <div class="modal-platforms">${platHtml}</div>
    ${screenshots ? `<div class="screenshots">${screenshots}</div>` : ''}
    ${(g.intel_category || g.intel_sub_genre || g.intel_genre || g.intel_theme) ? `
      <div style="margin-top:14px;padding:12px;background:var(--surface-2);border-radius:10px;font-size:12px;">
        <div style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:8px;">📊 Sensor Tower Taxonomy</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${g.intel_category ? `<span style="padding:3px 8px;background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-border);border-radius:5px;font-weight:600;">Category: ${escapeHtml(g.intel_category)}</span>` : ''}
          ${g.intel_sub_genre ? `<span style="padding:3px 8px;background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-border);border-radius:5px;font-weight:600;">Sub-genre: ${escapeHtml(g.intel_sub_genre)}</span>` : ''}
          ${g.intel_genre ? `<span style="padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);">Genre: ${escapeHtml(g.intel_genre)}</span>` : ''}
          ${g.intel_theme ? `<span style="padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);">Theme: ${escapeHtml(g.intel_theme)}</span>` : ''}
        </div>
      </div>` : ''}
    ${g.reason ? `<div class="modal-desc" style="font-size:11px;color:var(--text-soft);">Why this score: ${escapeHtml(g.reason)}</div>` : ''}
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') closeModal();
});

// ---------- theme ----------
const themeBtn = document.getElementById('themeBtn');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (_) {}
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(cur);
});
try {
  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);
} catch (_) {}

// ---------- escape helpers ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

loadData();
</script>
</body>
</html>
