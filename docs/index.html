<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agave Game Radar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.5;
  }
  .header {
    background: white;
    padding: 24px 32px;
    border-bottom: 1px solid #e5e5e7;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-icon {
    width: 56px;
    height: 56px;
    background: #d97548;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .header-text h1 { font-size: 24px; font-weight: 700; }
  .header-text p { font-size: 14px; color: #86868b; margin-top: 2px; }

  .stats {
    display: flex;
    gap: 16px;
    padding: 24px 32px;
    flex-wrap: wrap;
  }
  .stat {
    background: white;
    border-radius: 12px;
    padding: 16px 20px;
    flex: 1;
    min-width: 140px;
    border: 1px solid #e5e5e7;
  }
  .stat-label { font-size: 12px; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .stat-sub { font-size: 11px; color: #86868b; margin-top: 4px; }

  .controls {
    background: white;
    margin: 0 32px;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid #e5e5e7;
  }
  .search-box {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 600;
    color: #86868b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    min-width: 80px;
  }
  .pill-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill {
    padding: 6px 14px;
    border: 1px solid #d2d2d7;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .pill:hover { background: #f5f5f7; }
  .pill.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 24px 32px;
  }
  .game-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid #e5e5e7;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .game-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .added-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 11px;
    color: #86868b;
    background: #f5f5f7;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .added-tag.new {
    background: #d1f4e0;
    color: #1a7f3e;
  }
  .game-header {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    padding-right: 60px;
  }
  .game-icon {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: #f5f5f7;
    flex-shrink: 0;
    object-fit: cover;
  }
  .game-icon-fallback {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    font-weight: 700;
    flex-shrink: 0;
  }
  .game-info { flex: 1; min-width: 0; }
  .game-name {
    font-weight: 600;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .game-publisher {
    font-size: 12px;
    color: #86868b;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .game-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #f5f5f7;
    color: #1d1d1f;
    font-weight: 500;
  }
  .badge.score-high { background: #d1f4e0; color: #1a7f3e; }
  .badge.score-mid { background: #fff4d4; color: #8a6d00; }
  .badge.score-low { background: #ffe5e5; color: #b3261e; }
  .badge.platform-ios { background: #e8e8ed; }
  .badge.platform-android { background: #c8e6c9; color: #2e7d32; }
  .badge.installs { background: #e3f2fd; color: #1565c0; }

  .empty-state {
    text-align: center;
    padding: 80px 32px;
    color: #86868b;
  }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #1d1d1f; }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: white;
    border-radius: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .modal-header {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  .modal-icon { width: 80px; height: 80px; border-radius: 18px; }
  .modal-title { font-size: 22px; font-weight: 700; }
  .modal-publisher { color: #86868b; margin-top: 4px; }
  .modal-section { margin-bottom: 20px; }
  .modal-section-title {
    font-size: 11px;
    font-weight: 600;
    color: #86868b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .modal-section-content { font-size: 14px; line-height: 1.6; }
  .screenshots {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .screenshots img {
    height: 280px;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .modal-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: #1d1d1f;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn.secondary { background: #f5f5f7; color: #1d1d1f; }
  .close-btn {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #86868b;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌵</div>
  <div class="header-text">
    <h1>Agave Game Radar</h1>
    <p id="lastUpdated">Loading...</p>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by name or publisher...">

  <div class="filter-row">
    <span class="filter-label">Platform</span>
    <div class="pill-group" id="platformFilter">
      <button class="pill active" data-platform="all">All</button>
      <button class="pill" data-platform="ios">📱 iOS</button>
      <button class="pill" data-platform="android">🤖 Android</button>
    </div>
  </div>

  <div class="filter-row">
    <span class="filter-label">Min Score</span>
    <div class="pill-group" id="scoreFilter">
      <button class="pill active" data-score="0">All</button>
      <button class="pill" data-score="60">60+</button>
      <button class="pill" data-score="70">70+</button>
      <button class="pill" data-score="80">80+</button>
      <button class="pill" data-score="90">90+</button>
    </div>
  </div>

  <div class="filter-row">
    <span class="filter-label">Date Added</span>
    <div class="pill-group" id="dateFilter">
      <button class="pill active" data-days="0">All</button>
      <button class="pill" data-days="1">Today</button>
      <button class="pill" data-days="7">7 days</button>
    </div>
  </div>
</div>

<div id="gamesContainer" class="games-grid"></div>

<div class="modal" id="gameModal">
  <div class="modal-content" style="position: relative;">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let allGames = [];
let filters = { platform: 'all', minScore: 0, days: 0, search: '' };

async function loadData() {
  try {
    const res = await fetch('games_data.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allGames = data.games || [];

    const lastUpdated = data.last_updated || '';
    document.getElementById('lastUpdated').textContent =
      lastUpdated ? `Last updated: ${lastUpdated}` : 'No data yet';

    const totalToday = data.total_fetched_today ?? data.total_fetched ?? 0;
    const iosToday = data.ios_fetched_today ?? data.ios_fetched ?? 0;
    const androidToday = data.android_fetched_today ?? data.android_fetched ?? 0;
    const relevantToday = data.total_relevant_today ?? data.total_relevant ?? 0;
    const onSite = data.total_games_on_site ?? allGames.length;
    const retentionDays = data.retention_days ?? 30;

    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="stat-label">Scanned Today</div>
        <div class="stat-value">${totalToday.toLocaleString()}</div>
        <div class="stat-sub">games matching base criteria</div>
      </div>
      <div class="stat">
        <div class="stat-label">iOS / Android</div>
        <div class="stat-value">${iosToday} / ${androidToday}</div>
        <div class="stat-sub">today's platform split</div>
      </div>
      <div class="stat">
        <div class="stat-label">Portfolio Match</div>
        <div class="stat-value">${relevantToday}</div>
        <div class="stat-sub">fit Agave's mechanics</div>
      </div>
      <div class="stat">
        <div class="stat-label">On Radar (${retentionDays}d)</div>
        <div class="stat-value">${onSite}</div>
        <div class="stat-sub">cumulative unique games</div>
      </div>
    `;

    render();
  } catch (err) {
    document.getElementById('lastUpdated').textContent = 'Error loading data: ' + err.message;
    document.getElementById('gamesContainer').innerHTML =
      `<div class="empty-state"><h3>Couldn't load data</h3><p>${err.message}</p></div>`;
  }
}

function getInstalls(game) {
  return parseInt(game.installs || game.installs_total || game.installs_last_day || 0, 10) || 0;
}

function formatInstalls(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

function getScoreClass(score) {
  if (score >= 80) return 'score-high';
  if (score >= 60) return 'score-mid';
  return 'score-low';
}

function platformBadge(platform) {
  const p = (platform || '').toLowerCase();
  if (p === 'ios') return '<span class="badge platform-ios">📱 iOS</span>';
  if (p === 'android') return '<span class="badge platform-android">🤖 Android</span>';
  return `<span class="badge">${platform || '?'}</span>`;
}

function getIconUrl(game) {
  return game.icon_url || game.icon || '';
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const seenDate = new Date(dateStr + 'T00:00:00');
  if (isNaN(seenDate)) return '';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffMs = today - seenDate;
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffDays <= 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  if (diffDays < 7) return `${diffDays} days ago`;
  if (diffDays < 14) return '1 week ago';
  if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
  return `${Math.floor(diffDays / 30)} months ago`;
}

function renderCard(game) {
  const installs = getInstalls(game);
  const score = parseInt(game.score || 0, 10);
  const iconUrl = getIconUrl(game);
  const initial = (game.name || '?').charAt(0).toUpperCase();
  const addedAgo = timeAgo(game.first_seen);
  const isNew = addedAgo === 'Today' || addedAgo === 'Yesterday';

  const iconHTML = iconUrl
    ? `<img class="game-icon" src="${iconUrl}" onerror="this.outerHTML='<div class=&quot;game-icon-fallback&quot;>${initial}</div>'">`
    : `<div class="game-icon-fallback">${initial}</div>`;

  const addedHTML = addedAgo
    ? `<div class="added-tag ${isNew ? 'new' : ''}">Added ${addedAgo}</div>`
    : '';

  return `
    <div class="game-card" onclick='openModal(${JSON.stringify(game).replace(/'/g, "&apos;")})'>
      ${addedHTML}
      <div class="game-header">
        ${iconHTML}
        <div class="game-info">
          <div class="game-name">${escapeHtml(game.name || '?')}</div>
          <div class="game-publisher">${escapeHtml(game.publisher || '?')}</div>
        </div>
      </div>
      <div class="game-meta">
        ${platformBadge(game.platform)}
        <span class="badge installs">${formatInstalls(installs)} installs</span>
        <span class="badge ${getScoreClass(score)}">${score}/100</span>
        ${game.mechanic ? `<span class="badge">${escapeHtml(String(game.reason || game.mechanic).split('|')[0].replace('Mechanic:', '').trim())}</span>` : ''}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function render() {
  const container = document.getElementById('gamesContainer');
  let filtered = allGames.filter(g => {
    if (filters.platform !== 'all' && (g.platform || '').toLowerCase() !== filters.platform) return false;
    if (parseInt(g.score || 0, 10) < filters.minScore) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const name = (g.name || '').toLowerCase();
      const pub = (g.publisher || '').toLowerCase();
      if (!name.includes(q) && !pub.includes(q)) return false;
    }
    if (filters.days > 0) {
      const seen = g.first_seen || g.last_seen;
      if (!seen) return false;
      const cutoff = new Date(Date.now() - filters.days * 86400000);
      if (new Date(seen + 'T00:00:00') < cutoff) return false;
    }
    return true;
  });

  filtered.sort((a, b) => getInstalls(b) - getInstalls(a));

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><h3>No games match your filters</h3><p>Try changing the filters above.</p></div>`;
    return;
  }
  container.innerHTML = filtered.map(renderCard).join('');
}

function openModal(game) {
  const installs = getInstalls(game);
  const score = parseInt(game.score || 0, 10);
  const iconUrl = getIconUrl(game);
  const initial = (game.name || '?').charAt(0).toUpperCase();
  const addedAgo = timeAgo(game.first_seen);

  const iconHTML = iconUrl
    ? `<img class="modal-icon" src="${iconUrl}" onerror="this.style.display='none'">`
    : `<div class="game-icon-fallback" style="width:80px;height:80px;font-size:32px">${initial}</div>`;

  const screenshots = Array.isArray(game.screenshots) ? game.screenshots.filter(s => s) : [];
  const screenshotsHTML = screenshots.length
    ? `<div class="modal-section"><div class="modal-section-title">Screenshots</div>
       <div class="screenshots">${screenshots.map(s => `<img src="${s}" alt="screenshot">`).join('')}</div></div>`
    : '';

  const description = game.description || game.short_description || '';
  const descriptionHTML = description
    ? `<div class="modal-section"><div class="modal-section-title">Description</div>
       <div class="modal-section-content">${escapeHtml(description)}</div></div>`
    : '';

  const reasonHTML = game.reason
    ? `<div class="modal-section"><div class="modal-section-title">Why relevant</div>
       <div class="modal-section-content">${escapeHtml(game.reason)}</div></div>`
    : '';

  const storeUrl = game.store_url || '';
  const storeBtn = storeUrl ? `<a class="btn" href="${storeUrl}" target="_blank">📲 Open in Store</a>` : '';

  const addedDateHTML = addedAgo
    ? `<div class="added-tag" style="position: static; display: inline-block; margin-top: 8px;">Added ${addedAgo}</div>`
    : '';

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-header">
      ${iconHTML}
      <div>
        <div class="modal-title">${escapeHtml(game.name || '?')}</div>
        <div class="modal-publisher">${escapeHtml(game.publisher || '?')}</div>
        <div class="game-meta" style="margin-top:8px">
          ${platformBadge(game.platform)}
          <span class="badge installs">${formatInstalls(installs)} installs</span>
          <span class="badge ${getScoreClass(score)}">${score}/100</span>
          ${game.mechanic ? `<span class="badge">${escapeHtml(String(game.reason || game.mechanic).split('|')[0].replace('Mechanic:', '').trim())}</span>` : ''}
        </div>
        ${addedDateHTML}
      </div>
    </div>
    ${reasonHTML}
    ${descriptionHTML}
    ${screenshotsHTML}
    <div class="modal-buttons">${storeBtn}</div>
  `;
  document.getElementById('gameModal').classList.add('active');
}

function closeModal() {
  document.getElementById('gameModal').classList.remove('active');
}

document.getElementById('gameModal').addEventListener('click', e => {
  if (e.target.id === 'gameModal') closeModal();
});

document.getElementById('searchBox').addEventListener('input', e => {
  filters.search = e.target.value;
  render();
});

document.querySelectorAll('#platformFilter .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#platformFilter .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    filters.platform = p.dataset.platform;
    render();
  });
});

document.querySelectorAll('#scoreFilter .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#scoreFilter .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    filters.minScore = parseInt(p.dataset.score, 10);
    render();
  });
});

document.querySelectorAll('#dateFilter .pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#dateFilter .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    filters.days = parseInt(p.dataset.days, 10);
    render();
  });
});

loadData();
</script>

</body>
</html>
