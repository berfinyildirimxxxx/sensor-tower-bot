<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agave Game Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --surface-2: #f5f5f4;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --text: #1c1917;
    --text-muted: #57534e;
    --text-soft: #a8a29e;

    --orange: #ea580c;
    --orange-soft: #fff7ed;
    --orange-border: #fed7aa;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --green-border: #bbf7d0;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --blue-border: #bfdbfe;
    --purple: #7c3aed;
    --purple-soft: #faf5ff;
    --purple-border: #ddd6fe;
    --pink: #db2777;
    --pink-soft: #fdf2f8;
    --pink-border: #fbcfe8;
    --amber: #d97706;
    --red: #dc2626;
    --indigo: #4f46e5;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
  }

  [data-theme="dark"] {
    --bg: #0c0a09;
    --surface: #1c1917;
    --surface-2: #292524;
    --border: #292524;
    --border-strong: #44403c;
    --text: #fafaf9;
    --text-muted: #a8a29e;
    --text-soft: #78716c;

    --orange-soft: rgba(234, 88, 12, 0.12);
    --orange-border: rgba(234, 88, 12, 0.35);
    --green-soft: rgba(22, 163, 74, 0.12);
    --green-border: rgba(22, 163, 74, 0.35);
    --blue-soft: rgba(37, 99, 235, 0.12);
    --blue-border: rgba(37, 99, 235, 0.35);
    --purple-soft: rgba(124, 58, 237, 0.12);
    --purple-border: rgba(124, 58, 237, 0.35);
    --pink-soft: rgba(219, 39, 119, 0.12);
    --pink-border: rgba(219, 39, 119, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ============ TOPBAR ============ */
  .topbar {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  [data-theme="dark"] .topbar { background: rgba(28, 25, 23, 0.85); }
  .topbar::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--orange) 0%, var(--green) 50%, var(--purple) 100%);
    opacity: 0.7;
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, var(--text), var(--orange));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .logo-icon {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--orange-soft);
    border-radius: 8px;
    font-size: 16px;
    box-shadow: 0 0 12px rgba(234, 88, 12, 0.25);
  }
  .topbar-meta {
    flex: 1;
    color: var(--text-soft);
    font-size: 12px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: all 0.18s ease;
  }
  .btn-icon:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .btn-sheet {
    width: auto; padding: 0 12px; gap: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--green);
  }
  .btn-sheet:hover { background: var(--green-soft); border-color: var(--green-border); }

  /* ============ MAIN LAYOUT ============ */
  .main {
    max-width: 1400px; margin: 0 auto;
    padding: 0 24px;
  }
  .page-layout {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  /* ============ LEFT SIDEBAR ============ */
  .sidebar {
    width: 176px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    padding-top: 24px;
    z-index: 40;
  }
  .sidebar-header {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-soft);
    padding: 0 8px;
    margin-bottom: 6px;
  }
  .cat-item {
    position: relative;
  }
  .cat-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
    user-select: none;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .cat-trigger:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .cat-trigger.active {
    background: var(--orange-soft);
    color: var(--orange);
    font-weight: 600;
  }
  .cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-count {
    font-size: 10px;
    color: var(--text-soft);
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .cat-trigger.active .cat-count {
    background: var(--orange-border);
    color: var(--orange);
  }
  .cat-arrow {
    font-size: 11px;
    color: var(--text-soft);
    flex-shrink: 0;
    line-height: 1;
  }

  /* Flyout — shown/hidden by JS only */
  .cat-flyout {
    display: none;
    position: absolute;
    left: 100%;
    top: 0;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 6px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
  }
  .cat-flyout-header {
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    padding-bottom: 4px;
  }
  .cat-flyout-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(10, auto);
    gap: 2px 4px;
    max-width: calc(100vw - 220px);
  }
  @media (max-width: 900px) {
    .cat-flyout-grid {
      display: flex;
      flex-direction: column;
      max-width: none;
    }
  }
  .cat-flyout-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    min-width: 160px;
    transition: background 0.1s;
    user-select: none;
  }
  .cat-flyout-item:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .cat-flyout-item.active {
    background: var(--orange-soft);
    color: var(--orange);
    font-weight: 600;
  }
  .cat-flyout-label { flex: 1; }
  .cat-flyout-count {
    font-size: 10px;
    color: var(--text-soft);
    background: var(--surface-2);
    padding: 1px 4px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
  }
  .cat-flyout-item.active .cat-flyout-count {
    background: var(--orange-border);
    color: var(--orange);
  }
  .cat-divider {
    height: 1px;
    background: var(--border);
    margin: 3px 6px;
  }

  /* ============ CONTENT AREA ============ */
  .content { flex: 1; min-width: 0; padding-top: 24px; }

  /* ============ STAT CARD (single) ============ */
  .stats {
    margin-bottom: 20px;
  }
  .stat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px 18px 24px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .stat::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .stat.scanned::before { background: var(--orange); }
  .stat.scanned::after {
    content: '';
    position: absolute; right: -40px; top: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--orange-soft) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .stat-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 32px; font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat-sub {
    margin-top: 8px;
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; color: var(--text-muted);
  }
  .stat-sub-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ios { background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  .dot.android { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ============ FILTER BAR ============ */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .search-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .search {
    flex: 1; position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 13px;
    transition: all 0.15s ease;
  }
  .search input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-soft);
  }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--text-soft); font-size: 14px;
  }
  .view-toggle {
    display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .view-toggle button {
    padding: 7px 12px;
    background: var(--surface); color: var(--text-muted);
    border: none; cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all 0.15s;
  }
  .view-toggle button.active {
    background: var(--text); color: var(--surface);
  }

  .filter-row {
    display: flex; flex-direction: column; gap: 10px;
  }
  .filter-group {
    display: flex; align-items: center; gap: 8px;
  }
  .filter-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    min-width: 80px; flex-shrink: 0;
  }
  .filter-label::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
  }
  .fl-platform::before { background: var(--purple); }
  .fl-release::before { background: var(--amber); }
  .fl-sort::before { background: var(--indigo); }
  .fl-added::before { background: var(--orange); }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }

  .pill {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .pill:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    color: var(--text);
  }
  .pill.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
    font-weight: 600;
  }
  .pill .count {
    margin-left: 5px;
    opacity: 0.6;
    font-size: 11px;
  }
  .pills[data-group="platform"] .pill.active { background: var(--purple); border-color: var(--purple); color: white; box-shadow: 0 0 0 3px var(--purple-soft); }
  .pills[data-group="release"] .pill.active { background: var(--amber); border-color: var(--amber); color: white; }
  .pills[data-group="sort"] .pill.active { background: var(--indigo); border-color: var(--indigo); color: white; }
  .pills[data-group="added"] .pill.active { background: var(--orange); border-color: var(--orange); color: white; }

  .fl-install::before { background: var(--blue); }
  .install-input {
    width: 140px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .install-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .install-input.error {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
  }
  .install-error {
    font-size: 11px;
    color: var(--red);
    margin-left: 4px;
  }
  .install-clear {
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .install-clear:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    color: var(--text);
  }

  /* ============ RESULT BAR ============ */
  .result-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 8px 4px 14px;
    font-size: 12px; color: var(--text-muted);
  }
  .result-count strong { color: var(--text); font-weight: 600; }
  .btn-export {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-export:hover {
    background: var(--blue-soft);
    border-color: var(--blue-border);
    color: var(--blue);
  }

  /* ============ GAME GRID ============ */
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .games.list-view {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 140px;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--border-strong);
  }
  .card-head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .card-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  .card-title-block { flex: 1; min-width: 0; }
  .card-name {
    font-weight: 600; font-size: 14px;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-publisher {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badges {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 8px;
  }
  .badges-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 7px; border-radius: 5px;
    background: var(--surface-2);
    color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .badge.ios { background: var(--purple-soft); color: var(--purple); }
  .badge.android { background: var(--green-soft); color: var(--green); }
  .badge.installs { background: var(--blue-soft); color: var(--blue); }
  .badge.score-high { background: var(--green-soft); color: var(--green); }
  .badge.score-mid { background: rgba(217, 119, 6, 0.12); color: var(--amber); }
  .badge.score-low { background: rgba(220, 38, 38, 0.10); color: var(--red); }
  .badge.score-zero { background: var(--surface-2); color: var(--text-soft); }
  .badge.cat-badge {
    font-size: 11px;
    background: var(--purple-soft); color: var(--purple);
    border: 1px solid var(--purple-border);
  }
  .badge.mech-badge {
    font-size: 11px;
    background: rgba(217,119,6,0.12); color: var(--amber);
    border: 1px solid rgba(217,119,6,0.35);
  }
  .card-released {
    margin-top: 8px;
    font-size: 11px; color: var(--text-soft);
    display: flex; align-items: center; gap: 5px;
  }
  .card-released::before { content: '📅'; font-size: 11px; }
  .card-released.unavailable {
    color: var(--text-soft);
    font-style: italic;
  }
  .card-released.unavailable::before { content: ''; }

  /* ============ LIST VIEW ============ */
  .games.list-view .card {
    display: grid;
    grid-template-columns: 48px 1fr auto auto auto auto;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
  }
  .games.list-view .card-head { margin-bottom: 0; display: contents; }
  .games.list-view .card-title-block { min-width: 0; }
  .games.list-view .badges, .games.list-view .card-released, .games.list-view .card-added {
    position: static;
    margin: 0;
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    max-width: 720px; width: 100%;
    max-height: 90vh; overflow: auto;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { display: flex; gap: 16px; margin-bottom: 16px; }
  .modal-icon { width: 80px; height: 80px; border-radius: 16px; flex-shrink: 0; overflow: hidden; }
  .modal-icon img { width: 100%; height: 100%; object-fit: cover; }
  .modal-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .modal-publisher { color: var(--text-muted); font-size: 14px; margin: 0 0 10px; }
  .modal-close {
    margin-left: auto;
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface-2); border: none; cursor: pointer;
    font-size: 16px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .modal-close:hover { background: var(--red); color: white; transform: rotate(90deg); }
  .modal-desc { color: var(--text-muted); margin: 14px 0; line-height: 1.6; font-size: 13px; }
  .modal-platforms {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px; margin: 14px 0;
  }
  .platform-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
  }
  .platform-box-name { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .platform-box-row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-muted); }
  .platform-box-row strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .screenshots { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }

  .modal-actions { margin-top: 18px; display: flex; gap: 8px; }
  .btn-primary {
    padding: 9px 16px; background: linear-gradient(135deg, var(--orange), #c2410c);
    color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 13px;

  }

  /* ============ EMPTY ============ */
  .empty {

  @media (max-width: 900px) {
    .page-layout { flex-direction: column; gap: 0; }

  /* ============ TODAY ADDED BADGE ============ */
  .today-added-badge {

  /* list view: star becomes last grid column, not absolute */

<script>
// ---------- localStorage helpers ----------
function getStarred() {
  try { return JSON.parse(localStorage.getItem('agave_radar_starred') || '[]'); } catch { return []; }
}
function setStarred(arr) {
  try { localStorage.setItem('agave_radar_starred', JSON.stringify(arr)); } catch {}
}
function isStarred(key) { return getStarred().includes(key); }
function toggleStar(key) {
  const s = getStarred();
  const i = s.indexOf(key);
  if (i === -1) s.push(key); else s.splice(i, 1);
  setStarred(s);
}
function getLists() {
  try { return JSON.parse(localStorage.getItem('agave_radar_lists') || '{}'); } catch { return {}; }
}
function setLists(obj) {
  try { localStorage.setItem('agave_radar_lists', JSON.stringify(obj)); } catch {}
}
function createList(name) {
  const l = getLists();
  if (!l[name]) l[name] = [];
  setLists(l);
}
function deleteList(name) {
  const l = getLists();
  delete l[name];
  setLists(l);
}
function addGameToList(name, key) {
  const l = getLists();
  if (!l[name]) l[name] = [];
  if (!l[name].includes(key)) l[name].push(key);
  setLists(l);
}
function removeGameFromList(name, key) {
  const l = getLists();
  if (l[name]) l[name] = l[name].filter(k => k !== key);
  setLists(l);
}
function exportUserData() {
  return JSON.stringify({ starred: getStarred(), lists: getLists() }, null, 2);
}
function importUserData(json, merge) {
  const data = JSON.parse(json);
  if (merge) {
    setStarred([...new Set([...getStarred(), ...(data.starred || [])])]);
    const l = getLists();
    Object.entries(data.lists || {}).forEach(([name, keys]) => {
      if (!l[name]) l[name] = [];
      l[name] = [...new Set([...l[name], ...keys])];
    });
    setLists(l);
  } else {
    setStarred(data.starred || []);
    setLists(data.lists || {});
  }
}

let allGames = [];
let dataMeta = {};
let activeView = null; // null = normal category view, 'starred', or list name
const filters = {
  platform: 'all',
  category: 'all',
  mechanic: 'all',
  release: 'all',
  added: 'all',
  sort: 'installs',
  search: '',
  minInstalls: null,
};
let view = 'grid';

function getGameKey(g) {
  return ((g.name || '').toLowerCase().trim() + '||' + (g.publisher || '').toLowerCase().trim());
}

// ---------- helpers ----------
function getInstalls(g) {
  const v = g.installs_total ?? g.installs;
  if (typeof v === 'number') return v;
  const n = parseInt(String(v).replace(/[,.\s]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}
function fmtInstalls(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function daysAgo(s) {
  if (!s) return Infinity;
  const d = new Date(s);
  if (isNaN(d.getTime())) return Infinity;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}
function getPlatforms(g) {
  if (Array.isArray(g.platforms) && g.platforms.length) return g.platforms;
  return [{
    platform: g.platform || '',
    installs_total: getInstalls(g),
    launch_date: g.launch_date,
    store_url: g.store_url,
  }];
}
function hasPlatform(g, p) {
  const plats = getPlatforms(g).map(x => String(x.platform).toLowerCase());
  return plats.some(x => x.includes(p));
}

// ---------- data load ----------
const IS_DEV = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

async function loadData() {
  try {
    const dataUrl = IS_DEV ? '/api/games?_=' + Date.now() : 'games_data.json?_=' + Date.now();
    if (IS_DEV) {
      document.getElementById('lastUpdated').textContent = 'Fetching live data from Sensor Tower...';
    }
    const r = await fetch(dataUrl);
    const text = await r.text();
    if (!r.ok || text.trim().startsWith('<')) {
      document.getElementById('lastUpdated').textContent = 'No data yet — run the bot first (Actions → Daily Alert → Run workflow)';
      document.getElementById('sheetBtn').href = 'https://docs.google.com/spreadsheets/d/1u0E3Cj5Ryzmmqd7NJbgs6gcexTKBQ36c4dwLy4vF5Ws/edit';
      document.getElementById('sheetBtn').style.display = '';
      return;
    }
    const data = JSON.parse(text);
    allGames = data.games || [];
    dataMeta = data;
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + (data.last_updated || '—');

    const dateStr = data.run_date || new Date().toISOString().slice(0, 10);
    document.getElementById('scannedLabel').textContent = 'Scanned ' + fmtDate(dateStr);
    document.getElementById('scannedValue').textContent = (data.total_games_on_site || data.total_fetched_today || 0).toLocaleString();

    const iosGames = (allGames || []).filter(g => hasPlatform(g, 'ios'));
    const androidGames = (allGames || []).filter(g => hasPlatform(g, 'android'));
    document.getElementById('iosCount').textContent = iosGames.length.toLocaleString();
    document.getElementById('androidCount').textContent = androidGames.length.toLocaleString();

    const todayAdded = data.today_added_count;
    const todayAddedDate = data.today_added_date;
    const todayBadge = document.getElementById('todayAddedBadge');
    if (todayAdded > 0 && todayAddedDate === dateStr) {
      document.getElementById('todayAddedCount').textContent = todayAdded.toLocaleString();
      todayBadge.style.display = '';
    } else {
      todayBadge.style.display = 'none';
    }

    const sheetBtn = document.getElementById('sheetBtn');
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1u0E3Cj5Ryzmmqd7NJbgs6gcexTKBQ36c4dwLy4vF5Ws/edit';
    sheetBtn.href = data.sheet_url || SHEET_URL;
    sheetBtn.style.display = '';

    buildSidebar();
    bindFilters();
    render();
  } catch (e) {
    console.error('Load failed', e);
    document.getElementById('lastUpdated').textContent = 'Failed to load data';
  }
}

// ---------- category order ----------
const CATEGORY_ORDER = ['Puzzle','Casual','Word','Board','Family','Trivia','Arcade','Card','Educational'];

const MECHANIC_ORDER = [
  'Match Swap','Match Blast','Match Chain','Match Merge 2','Match Merge 3','Match Pair',
  'Sort','Block','Screw','Solitaire','Bubble Shooter','Hidden Objects','Jigsaw',
  'Escape Room','Physics','Maze','Numbers','Riddle','Real-Time Puzzle',
  'Environmental','Word','Trivia','Other Puzzle',
];

// ---------- sidebar ----------
function getSubGenresForCategory(category) {
  const pool = allGames.filter(g => (g.intel_category || '') === category);
  const counts = new Map();
  pool.forEach(g => {
    const m = (g.intel_sub_genre || '').trim();
    if (m) counts.set(m, (counts.get(m) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => {
    const ai = MECHANIC_ORDER.indexOf(a[0]);
    const bi = MECHANIC_ORDER.indexOf(b[0]);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return b[1] - a[1];
  });
}

function buildSidebar() {
  const counts = new Map();
  allGames.forEach(g => {
    const cat = (g.intel_category || '').trim();
    if (cat) counts.set(cat, (counts.get(cat) || 0) + 1);
  });

  const sorted = [...counts.entries()].sort((a, b) => {
    const ai = CATEGORY_ORDER.indexOf(a[0]);
    const bi = CATEGORY_ORDER.indexOf(b[0]);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a[0].localeCompare(b[0]);
  });

  document.getElementById('catAllCount').textContent = allGames.length;

  const list = document.getElementById('catList');
  list.innerHTML = '';

  sorted.forEach(([name, count]) => {
    const subGenres = getSubGenresForCategory(name);
    const hasSubGenres = subGenres.length > 0;

    const item = document.createElement('div');
    item.className = 'cat-item';

    let flyoutHtml = '';
    if (hasSubGenres) {
      const sgItems = subGenres.map(([sg, sgCount]) =>
        `<div class="cat-flyout-item" data-mechanic="${escapeAttr(sg)}">
          <span class="cat-flyout-label">${escapeHtml(sg)}</span>
          <span class="cat-flyout-count">${sgCount}</span>
        </div>`
      ).join('');
      flyoutHtml = `
        <div class="cat-flyout">
          <div class="cat-flyout-header">
            <div class="cat-flyout-item" data-mechanic="all" data-category="${escapeAttr(name)}">
              <span class="cat-flyout-label">All</span>
              <span class="cat-flyout-count">${count}</span>
            </div>
          </div>
          <div class="cat-flyout-grid">
            ${sgItems}
          </div>
        </div>`;
    }

    item.innerHTML = `
      <button class="cat-trigger" data-category="${escapeAttr(name)}">
        <span class="cat-name">${escapeHtml(name)}</span>
        <span class="cat-count">${count}</span>
        ${hasSubGenres ? '<span class="cat-arrow">›</span>' : ''}
      </button>
      ${flyoutHtml}`;

    list.appendChild(item);
  });

  // event delegation on sidebar
  document.getElementById('sidebar').addEventListener('click', e => {
    const flyoutItem = e.target.closest('.cat-flyout-item');
    const trigger = e.target.closest('.cat-trigger');

    if (flyoutItem) {
      e.stopPropagation();
      const mechanic = flyoutItem.dataset.mechanic;
      const parentItem = flyoutItem.closest('.cat-item');
      const cat = parentItem
        ? parentItem.querySelector('.cat-trigger')?.dataset.category
        : flyoutItem.dataset.category;
      selectCategory(cat || 'all', mechanic === 'all' ? 'all' : mechanic);
    } else if (trigger) {
      selectCategory(trigger.dataset.category, 'all');
    }
  });

  initFlyouts();
  buildMyViews();
}

function initFlyouts() {
  const catItems = document.querySelectorAll('#catList .cat-item');
  let activeItem = null;

  function closeAll() {
    catItems.forEach(item => {
      const f = item.querySelector('.cat-flyout');
      if (f) f.style.display = 'none';
    });
    activeItem = null;
  }

  catItems.forEach(item => {
    const flyout = item.querySelector('.cat-flyout');
    if (!flyout) return;

    item.addEventListener('mouseenter', () => {
      if (activeItem && activeItem !== item) {
        const prev = activeItem.querySelector('.cat-flyout');
        if (prev) prev.style.display = 'none';
      }
      flyout.style.display = 'block';
      activeItem = item;
    });

    item.addEventListener('mouseleave', (e) => {
      if (flyout.contains(e.relatedTarget)) return;
      flyout.style.display = 'none';
      if (activeItem === item) activeItem = null;
    });

    flyout.addEventListener('mouseleave', (e) => {
      if (item.contains(e.relatedTarget)) return;
      flyout.style.display = 'none';
      if (activeItem === item) activeItem = null;
    });
  });

  document.getElementById('sidebar').addEventListener('mouseleave', closeAll);
}

function buildMyViews() {
  const section = document.getElementById('myViewsSection');
  const divider = document.getElementById('sidebarDivider');
  if (!section) return;

  const starred = getStarred();
  const lists = getLists();
  const listNames = Object.keys(lists);

  const hasAny = starred.length > 0 || listNames.length > 0;
  if (divider) divider.style.display = hasAny ? '' : 'none';

  const starredActive = activeView === 'starred' ? ' active' : '';
  let html = `<div class="my-views-header">My Views</div>
    <button class="view-item${starredActive}" id="viewStarredBtn">
      <span>⭐</span>
      <span class="view-name">Starred</span>
      <span class="view-count">${starred.length}</span>
    </button>`;

  listNames.forEach(name => {
    const isActive = activeView === name ? ' active' : '';
    const count = (lists[name] || []).length;
    html += `
      <button class="view-item${isActive}" data-list="${escapeAttr(name)}">
        <span>📋</span>
        <span class="view-name">${escapeHtml(name)}</span>
        <span class="view-count">${count}</span>
        <span class="view-delete" data-delete-list="${escapeAttr(name)}" title="Delete list">×</span>
      </button>`;
  });

  html += `<button class="new-list-btn" id="newListBtn">＋ New list</button>`;
  section.innerHTML = html;

  section.querySelector('#viewStarredBtn').addEventListener('click', () => selectView('starred'));

  section.querySelectorAll('[data-list]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-delete-list]')) return;
      selectView(el.dataset.list);
    });
  });

  section.querySelectorAll('[data-delete-list]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const name = btn.dataset.deleteList;
      if (confirm(`Delete list "${name}"?\n\nThis won't delete the games, just the list.`)) {
        deleteList(name);
        if (activeView === name) selectView(null);
        else buildMyViews();
      }
    });
  });

  section.querySelector('#newListBtn').addEventListener('click', () => {
    const name = prompt('New list name:');
    if (name && name.trim()) {
      createList(name.trim());
      buildMyViews();
    }
  });
}

function selectView(view) {
  activeView = view;
  document.querySelectorAll('#sidebar .cat-trigger').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.cat-flyout-item').forEach(el => el.classList.remove('active'));
  if (!view) {
    document.getElementById('catAll').classList.add('active');
    filters.category = 'all';
    filters.mechanic = 'all';
  }
  buildMyViews();
  render();
}

function selectCategory(category, mechanic) {
  activeView = null;
  filters.category = category;
  filters.mechanic = mechanic || 'all';

  document.querySelectorAll('#sidebar .cat-trigger').forEach(el => el.classList.remove('active'));
  if (category === 'all') {
    document.getElementById('catAll').classList.add('active');
  } else {
    const trigger = document.querySelector(`#catList .cat-trigger[data-category="${CSS.escape(category)}"]`);
    if (trigger) trigger.classList.add('active');
  }

  document.querySelectorAll('.cat-flyout-item').forEach(el => el.classList.remove('active'));
  if (mechanic && mechanic !== 'all') {
    document.querySelectorAll(`.cat-flyout-item[data-mechanic="${CSS.escape(mechanic)}"]`).forEach(el => {
      el.classList.add('active');
    });
  }

  render();
}

// ---------- bind filter pills ----------
function bindFilters() {
  document.querySelectorAll('.pills').forEach(group => {
    group.addEventListener('click', e => {
      const pill = e.target.closest('.pill');
      if (!pill) return;
      group.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const g = group.dataset.group;
      if (g === 'platform') filters.platform = pill.dataset.platform;
      if (g === 'release') filters.release = pill.dataset.release;
      if (g === 'sort') filters.sort = pill.dataset.sort;
      if (g === 'added') filters.added = pill.dataset.added;
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    filters.search = e.target.value.trim().toLowerCase();
    render();
  });

  const maxInstallInput = document.getElementById('maxInstallInput');
  const maxInstallError = document.getElementById('maxInstallError');
  const maxInstallClear = document.getElementById('maxInstallClear');

  function applyMaxInstallInput() {
    const val = maxInstallInput.value.trim();
    if (val === '') {
      maxInstallInput.classList.remove('error');
      maxInstallError.style.display = 'none';
      maxInstallClear.style.display = 'none';
      filters.minInstalls = null;
      render();
      return;
    }
    if (val.includes('.') || val.includes(',')) {
      maxInstallInput.classList.add('error');
      maxInstallError.textContent = 'No dots or commas — enter a plain number (e.g. 1500)';
      maxInstallError.style.display = '';
      maxInstallClear.style.display = '';
      filters.minInstalls = null;
      render();
      return;
    }
    const n = parseInt(val, 10);
    if (isNaN(n) || n < 0 || String(n) !== val) {
      maxInstallInput.classList.add('error');
      maxInstallError.textContent = 'Enter a whole number (e.g. 1500)';
      maxInstallError.style.display = '';
      maxInstallClear.style.display = '';
      filters.minInstalls = null;
      render();
      return;
    }
    maxInstallInput.classList.remove('error');
    maxInstallError.style.display = 'none';
    maxInstallClear.style.display = '';
    filters.minInstalls = n;
    render();
  }

  maxInstallInput.addEventListener('input', applyMaxInstallInput);
  maxInstallClear.addEventListener('click', () => {
    maxInstallInput.value = '';
    maxInstallInput.classList.remove('error');
    maxInstallError.style.display = 'none';
    maxInstallClear.style.display = 'none';
    filters.minInstalls = null;
    render();
  });

  document.getElementById('viewGrid').addEventListener('click', () => setView('grid'));
  document.getElementById('viewList').addEventListener('click', () => setView('list'));

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
    if (e.key === 'Escape') closeModal();
  });
}

function setView(v) {
  view = v;
  document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
  document.getElementById('viewList').classList.toggle('active', v === 'list');
  document.getElementById('gamesGrid').classList.toggle('list-view', v === 'list');
}

// ---------- filter + render ----------
function addedDaysAgo(g) {
  return daysAgo(g.added_date || g.first_seen);
}

function addedBadgeHtml(g) {
  const days = addedDaysAgo(g);
  if (days === 0) return '<div class="card-added added-today">Today</div>';
  if (days === 1) return '<div class="card-added">Yesterday</div>';
  if (days <= 7) return `<div class="card-added">${days}d ago</div>`;
  return '';
}

function applyFilters() {
  return allGames.filter(g => {
    // Special view filter: starred / named list (replaces category filter)
    if (activeView === 'starred') {
      if (!getStarred().includes(getGameKey(g))) return false;
    } else if (activeView !== null) {
      const listKeys = (getLists()[activeView] || []);
      if (!listKeys.includes(getGameKey(g))) return false;
    } else {
      // Normal category view
      if (filters.category !== 'all' && (g.intel_category || '') !== filters.category) return false;
      if (filters.mechanic !== 'all' && (g.intel_sub_genre || '') !== filters.mechanic) return false;
    }

    if (filters.platform !== 'all' && !hasPlatform(g, filters.platform)) return false;

    if (filters.release === 'na') {
      if (g.launch_date) return false;
    } else if (filters.release !== 'all') {
      const r = daysAgo(g.launch_date);
      if (r > parseInt(filters.release, 10)) return false;
    }

    if (filters.added !== 'all') {
      const d = addedDaysAgo(g);
      if (filters.added === 'today' && d !== 0) return false;
      if (filters.added === 'yesterday' && d !== 1) return false;
      if (filters.added === '3' && d > 2) return false;
      if (filters.added === '7' && d > 6) return false;
      if (filters.added === '14' && d > 13) return false;
    }

    if (filters.search) {
      const hay = ((g.name || '') + ' ' + (g.publisher || '')).toLowerCase();
      if (!hay.includes(filters.search)) return false;
    }
    if (filters.minInstalls !== null && getInstalls(g) < filters.minInstalls) return false;
    return true;
  });
}

function sortGames(games) {
  const s = filters.sort;
  return [...games].sort((a, b) => {
    if (s === 'installs') return getInstalls(b) - getInstalls(a);
    if (s === 'added') return (b.first_seen || '').localeCompare(a.first_seen || '');
    if (s === 'released') return (b.launch_date || '').localeCompare(a.launch_date || '');
    return 0;
  });
}

function render() {
  buildMyViews();

  let games = applyFilters();
  games = sortGames(games);

  document.getElementById('shownCount').textContent = games.length.toLocaleString();
  document.getElementById('totalCount').textContent = allGames.length.toLocaleString();

  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');
  if (!games.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  grid.innerHTML = games.map((g, i) => renderCard(g, i)).join('');

  grid.querySelectorAll('.card').forEach((el, i) => {
    el.addEventListener('click', () => openModal(games[i]));
  });

  grid.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const key = btn.dataset.star;
      toggleStar(key);
      const starred = isStarred(key);
      btn.textContent = starred ? '★' : '☆';
      btn.className = `star-btn${starred ? ' starred' : ''}`;
      btn.title = starred ? 'Unstar this game' : 'Star this game';
      buildMyViews();
      // If in starred view and just unstarred, remove the card with animation
      if (activeView === 'starred' && !starred) {
        const card = btn.closest('.card');
        if (card) {
          card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.95)';
          setTimeout(() => render(), 200);
        }
      }
    });
  });
}

function renderCard(g) {
  const key = getGameKey(g);
  const starred = isStarred(key);
  const installs = getInstalls(g);
  const plats = getPlatforms(g);

  const iconHtml = g.icon_url
    ? `<img src="${escapeAttr(g.icon_url)}" alt="" onerror="this.parentNode.innerHTML='${(g.name||'?').charAt(0).toUpperCase()}'; this.parentNode.style.background='${pickIconColor(g.intel_category)}';" />`
    : `<span>${(g.name || '?').charAt(0).toUpperCase()}</span>`;
  const iconStyle = g.icon_url ? '' : `background:${pickIconColor(g.intel_category)};`;

  const platformBadges = plats.map(p => {
    const name = String(p.platform || '').toLowerCase();
    if (name.includes('ios')) return '<span class="badge ios">📱 iOS</span>';
    if (name.includes('android')) return '<span class="badge android">🤖 Android</span>';
    return '';
  }).join('');

  const cat = g.intel_category || g.category || '';
  const mech = g.intel_sub_genre || '';
  const catBadge = cat ? `<span class="badge cat-badge">${escapeHtml(cat)}</span>` : '';
  const mechBadge = mech ? `<span class="badge mech-badge">Mechanic: ${escapeHtml(mech)}</span>` : '';

  const releaseHtml = g.launch_date
    ? `<div class="card-released">Released ${fmtDate(g.launch_date)}</div>`
    : `<div class="card-released unavailable">Release info is not available.</div>`;

  const addedHtml = addedBadgeHtml(g);

  return `
    <div class="card" data-key="${escapeAttr(key)}">
      <button class="star-btn${starred ? ' starred' : ''}" data-star="${escapeAttr(key)}" title="${starred ? 'Unstar' : 'Star'} this game">${starred ? '★' : '☆'}</button>
      <div class="card-head">
        <div class="card-icon" style="${iconStyle}">${iconHtml}</div>
        <div class="card-title-block">
          <div class="card-name">${escapeHtml(g.name || 'Unknown')}</div>
          <div class="card-publisher">${escapeHtml(g.publisher || '—')}</div>
        </div>
      </div>
      <div class="badges">
        <div class="badges-row">
          ${platformBadges}
          <span class="badge installs">${fmtInstalls(installs)} installs</span>
        </div>
        ${catBadge}
        ${mechBadge}
      </div>
      ${releaseHtml}
      ${addedHtml}
    </div>
  `;
}

function pickIconColor(cat) {
  const map = {
    'Puzzle': '#7c3aed', 'Casual': '#ea580c', 'Word': '#16a34a',
    'Board': '#0891b2', 'Family': '#db2777', 'Trivia': '#d97706',
    'Arcade': '#dc2626', 'Card': '#0d9488', 'Educational': '#2563eb',
  };
  return map[cat] || '#78716c';
}

// ---------- export CSV ----------
function exportCSV() {
  const games = sortGames(applyFilters());
  const headers = ['Name','Publisher','Platform','Category','Mechanic','Release Date','Total Installs','Store URL'];
  const rows = games.map(g => [
    g.name || '',
    g.publisher || '',
    getPlatforms(g).map(p => p.platform).filter(Boolean).join('+'),
    g.intel_category || g.category || '',
    g.intel_sub_genre || '',
    g.launch_date || '',
    getInstalls(g),
    getPlatforms(g).map(p => p.store_url).filter(Boolean).join(' | '),
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const today = new Date().toISOString().slice(0, 10);
  a.download = `agave-radar-${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  buildModalListDropdown(getGameKey(g));

}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') closeModal();
});

function buildModalListDropdown(gameKey) {
  const btn = document.getElementById('modalListBtn');
  const dropdown = document.getElementById('modalListDropdown');
  if (!btn || !dropdown) return;

  function populate() {
    const lists = getLists();
    const names = Object.keys(lists);
    let html = '';
    if (!names.length) {
      html += `<div style="padding:8px 10px;font-size:12px;color:var(--text-soft);">No lists yet</div>`;
    } else {
      names.forEach(name => {
        const inList = (lists[name] || []).includes(gameKey);
        html += `<label class="list-dropdown-item">
          <input type="checkbox" data-list-name="${escapeAttr(name)}"${inList ? ' checked' : ''}>
          <span style="flex:1;">${escapeHtml(name)}</span>
          <span style="font-size:10px;color:var(--text-soft);font-family:monospace;">${(lists[name]||[]).length}</span>
        </label>`;
      });
    }
    html += `<div class="list-dropdown-divider"></div>
      <div class="list-dropdown-new" id="dropdownNewList">＋ New list</div>`;
    dropdown.innerHTML = html;

    dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) addGameToList(cb.dataset.listName, gameKey);
        else removeGameFromList(cb.dataset.listName, gameKey);
        buildMyViews();
        if (activeView === cb.dataset.listName) render();
      });
    });

    const newBtn = document.getElementById('dropdownNewList');
    if (newBtn) {
      newBtn.addEventListener('click', () => {
        const name = prompt('New list name:');
        if (name && name.trim()) {
          createList(name.trim());
          addGameToList(name.trim(), gameKey);
          buildMyViews();
          populate();
        }
      });
    }
  }

  populate();

  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = dropdown.classList.contains('open');
    if (open) { dropdown.classList.remove('open'); }
    else { populate(); dropdown.classList.add('open'); }
  });

  document.addEventListener('click', function handler(e) {
    if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      document.removeEventListener('click', handler);
    }
  });
}

// ---------- data export / import ----------
function initDataMenu() {
  const menuBtn = document.getElementById('dataMenuBtn');
  const menu = document.getElementById('dataMenu');

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });

  document.addEventListener('click', e => {
    const wrap = document.getElementById('dataMenuWrap');
    if (wrap && !wrap.contains(e.target)) menu.classList.remove('open');
  });

  document.getElementById('exportDataBtn').addEventListener('click', () => {
    menu.classList.remove('open');
    const json = exportUserData();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agave-radar-mydata-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importDataBtn').addEventListener('click', () => {
    menu.classList.remove('open');
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const replace = confirm('Replace your current data with this file?\n\nOK = Replace\nCancel = Merge with existing data');
          importUserData(ev.target.result, !replace);
          buildMyViews();
          render();
          alert('Data imported successfully!');
        } catch {
          alert('Failed to import — make sure it\'s a valid export file.');
        }
      };
      reader.readAsText(file);
    };
    document.body.appendChild(input);
    input.click();
    document.body.removeChild(input);
  });
}

// ---------- theme ----------
const themeBtn = document.getElementById('themeBtn');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (_) {}
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(cur);
});
try {
  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);
} catch (_) {}

// ---------- escape helpers ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

initDataMenu();
loadData();
</script>
