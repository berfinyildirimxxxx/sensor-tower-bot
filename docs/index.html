<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agave Game Radar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f2;
    --surface: #ffffff;
    --surface-2: #ebeae7;
    --border: #d4d3d0;
    --text: #2a2a2a;
    --text-muted: #7c7a7a;
    --text-soft: #b3b3b4;
    --accent: #d97757;
    --accent-soft: rgba(217, 119, 87, 0.12);
    --accent-strong: #c25c3d;
    --ios: #4a6fa5;
    --android: #5a8a4a;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  .header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }
  .header-title { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: var(--shadow);
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: var(--surface-2);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .stat-value { font-weight: 700; color: var(--text); }
  .stat.accent { background: var(--accent-soft); border-color: rgba(217, 119, 87, 0.3); }
  .stat.accent .stat-value { color: var(--accent-strong); }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .controls-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls-row + .controls-row { margin-top: 12px; }
  .search {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .filter-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-right: 4px;
  }
  .btn-group {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .btn {
    padding: 6px 12px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .btn:hover { color: var(--text); }
  .btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .btn.active.accent {
    background: var(--accent);
    color: white;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    box-shadow: var(--shadow);
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: var(--shadow-hover);
  }
  .card.new::before {
    content: 'NEW';
    position: absolute;
    top: 12px; right: 12px;
    background: var(--accent);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .card-top { display: flex; gap: 12px; margin-bottom: 12px; }
  .card-icon, .card-icon-fallback {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .card-icon { object-fit: cover; }
  .card-icon-fallback {
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .card-info { flex: 1; min-width: 0; padding-right: 36px; }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .card-pub {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; }
  .badge {
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-muted);
    font-weight: 600;
  }
  .badge.platform-ios { background: rgba(74, 111, 165, 0.12); color: var(--ios); }
  .badge.platform-android { background: rgba(90, 138, 74, 0.12); color: var(--android); }
  .badge.installs { background: var(--accent-soft); color: var(--accent-strong); }
  .badge.score-high { background: rgba(90, 138, 74, 0.15); color: var(--android); }
  .badge.score-mid { background: rgba(217, 119, 87, 0.12); color: var(--accent-strong); }
  .badge.score-low { background: var(--surface-2); color: var(--text-muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42, 42, 42, 0.55);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 700px;
    width: 100%;
    padding: 28px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--surface-2);
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
  }
  .modal-close:hover { background: var(--border); }
  .modal-header { display: flex; gap: 16px; margin-bottom: 20px; align-items: flex-start; }
  .modal-icon {
    width: 80px; height: 80px;
    border-radius: 16px;
    background: var(--surface-2);
    object-fit: cover;
    flex-shrink: 0;
  }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
  .modal-pub { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }
  .modal-section { margin-top: 20px; }
  .modal-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .modal-desc {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }
  .modal-reason {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
  }
  .screenshots {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .screenshots img {
    height: 240px;
    border-radius: 8px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .modal-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .link-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .link-btn:hover { background: var(--accent-strong); }
  .error-box {
    background: #fff5f4;
    border: 1px solid #ffd4ce;
    color: #b8533a;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="header-title">
        <div class="logo">🌵</div>
        <div>
          <h1>Agave Game Radar</h1>
          <div class="subtitle" id="last-updated">Loading…</div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <div class="container">
    <div id="error-container"></div>

    <div class="controls">
      <div class="controls-row">
        <input type="text" class="search" id="search" placeholder="🔍 Search by name or publisher…" />
      </div>
      <div class="controls-row">
        <span class="filter-label">Platform</span>
        <div class="btn-group" id="platform-filter">
          <button class="btn active" data-platform="all">All</button>
          <button class="btn" data-platform="ios">📱 iOS</button>
          <button class="btn" data-platform="android">🤖 Android</button>
        </div>

        <span class="filter-label" style="margin-left: 12px;">Min score</span>
        <div class="btn-group" id="score-filter">
          <button class="btn active" data-score="0">All</button>
          <button class="btn" data-score="60">60+</button>
          <button class="btn" data-score="70">70+</button>
          <button class="btn" data-score="80">80+</button>
          <button class="btn" data-score="90">90+</button>
        </div>

        <span class="filter-label" style="margin-left: 12px;">Date</span>
        <div class="btn-group" id="date-filter">
          <button class="btn active" data-date="all">All</button>
          <button class="btn accent" data-date="today">Today</button>
          <button class="btn" data-date="week">7 days</button>
        </div>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

<script>
  let allGames = [];
  let runDate = '';
  let currentPlatform = 'all';
  let currentScore = 0;
  let currentDate = 'all';
  let searchQuery = '';

  function showError(msg) {
    document.getElementById('error-container').innerHTML =
      '<div class="error-box">⚠️ ' + msg + '</div>';
  }

  function formatNumber(n) {
    n = parseInt(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
  }

  function getInstalls(g) {
    return parseInt(g.installs || g.installs_total || g.installs_last_day || 0) || 0;
  }
  function getIcon(g) { return g.icon_url || g.icon || ''; }
  function getScreenshots(g) { return g.screenshots || g.screenshot_urls || []; }
  function getReleaseDate(g) {
    const d = g.launch_date || g.release_date || '';
    return d ? d.split('T')[0] : '';
  }
  function getDescription(g) {
    return g.description || g.short_description || 'No description available.';
  }
  function getLastSeen(g) { return g.last_seen || g.first_seen || ''; }

  function platformLabel(p) { return p === 'ios' ? '📱 iOS' : '🤖 Android'; }

  function scoreClass(score) {
    score = parseInt(score) || 0;
    if (score >= 80) return 'score-high';
    if (score >= 60) return 'score-mid';
    return 'score-low';
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function isWithinDays(dateStr, days) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    const now = new Date();
    const diffMs = now - d;
    return diffMs <= days * 24 * 60 * 60 * 1000;
  }

  function render() {
    const grid = document.getElementById('grid');
    const q = searchQuery.toLowerCase().trim();

    let filtered = allGames.filter(g => {
      if (currentPlatform !== 'all' && g.platform !== currentPlatform) return false;
      if (currentScore > 0 && (parseInt(g.score) || 0) < currentScore) return false;
      if (currentDate === 'today' && getLastSeen(g) !== runDate) return false;
      if (currentDate === 'week' && !isWithinDays(getLastSeen(g), 7)) return false;
      if (q) {
        const hay = ((g.name || '') + ' ' + (g.publisher || '')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Sort: most recent (last_seen desc), then iOS first, then by installs
    filtered.sort((a, b) => {
      const lsA = getLastSeen(a);
      const lsB = getLastSeen(b);
      if (lsA !== lsB) return lsB.localeCompare(lsA);
      if (a.platform !== b.platform) return a.platform === 'ios' ? -1 : 1;
      return getInstalls(b) - getInstalls(a);
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">No games match these filters.</div>';
      return;
    }

    grid.innerHTML = filtered.map(g => {
      const idx = allGames.indexOf(g);
      const installs = getInstalls(g);
      const iconUrl = getIcon(g);
      const screenshots = getScreenshots(g);
      const displayIcon = iconUrl || (screenshots && screenshots[0]) || '';
      const isNew = getLastSeen(g) === runDate;
      const score = parseInt(g.score) || 0;

      const icon = displayIcon
        ? `<img class="card-icon" src="${displayIcon}" alt="" onerror="this.outerHTML='<div class=\\'card-icon-fallback\\'>🎮</div>'" />`
        : `<div class="card-icon-fallback">🎮</div>`;

      return `
        <div class="card ${isNew ? 'new' : ''}" data-idx="${idx}">
          <div class="card-top">
            ${icon}
            <div class="card-info">
              <div class="card-name">${escapeHtml(g.name || 'Unknown')}</div>
              <div class="card-pub">${escapeHtml(g.publisher || '—')}</div>
            </div>
          </div>
          <div class="card-meta">
            <span class="badge platform-${g.platform}">${platformLabel(g.platform)}</span>
            <span class="badge installs">${formatNumber(installs)}</span>
            ${score ? `<span class="badge ${scoreClass(score)}">★ ${score}</span>` : ''}
            ${g.mechanic ? `<span class="badge">${escapeHtml(g.mechanic)}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        openModal(allGames[parseInt(card.dataset.idx)]);
      });
    });
  }

  function openModal(g) {
    const installs = getInstalls(g);
    const iconUrl = getIcon(g);
    const screenshots = getScreenshots(g);
    const displayIcon = iconUrl || (screenshots && screenshots[0]) || '';
    const releaseDate = getReleaseDate(g);
    const desc = getDescription(g);
    const score = parseInt(g.score) || 0;

    const icon = displayIcon
      ? `<img class="modal-icon" src="${displayIcon}" alt="" onerror="this.style.display='none'" />`
      : `<div class="modal-icon" style="display:flex;align-items:center;justify-content:center;font-size:36px">🎮</div>`;

    const ssHtml = screenshots.length > 0
      ? `<div class="modal-section">
           <h3>Screenshots</h3>
           <div class="screenshots">
             ${screenshots.slice(0, 6).map(s => `<img src="${escapeHtml(s)}" alt="" />`).join('')}
           </div>
         </div>`
      : '';

    const links = [];
    if (g.store_url) {
      const label = g.platform === 'ios' ? 'App Store' : 'Google Play';
      links.push(`<a class="link-btn" href="${escapeHtml(g.store_url)}" target="_blank" rel="noopener">View on ${label}</a>`);
    }

    document.getElementById('modal-content').innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-header">
        ${icon}
        <div style="flex:1;min-width:0;">
          <div class="modal-title">${escapeHtml(g.name || 'Unknown')}</div>
          <div class="modal-pub">${escapeHtml(g.publisher || '—')}</div>
          <div class="card-meta">
            <span class="badge platform-${g.platform}">${platformLabel(g.platform)}</span>
            <span class="badge installs">${formatNumber(installs)} installs</span>
            ${score ? `<span class="badge ${scoreClass(score)}">★ Score ${score}</span>` : ''}
